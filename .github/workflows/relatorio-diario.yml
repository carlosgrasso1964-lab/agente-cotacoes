name: Relatório Diário

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Necessário para o auto-commit da planilha de histórico
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl matplotlib
      - name: Run script
        run: |
          python agente_cotacoes.py
          python gerar_graficos.py
          python enviar_telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit updated spreadsheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotacoes_historico.xlsx
          if git diff --cached --quiet; then
            echo "Sem mudanças na planilha (nada a commitar)."
          else
            git commit -m "chore: atualiza cotacoes_historico.xlsx [skip ci]"
            git push
          fi